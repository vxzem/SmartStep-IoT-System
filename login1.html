<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStep | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Lexend:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sapphire: #3b507d;
            --navy-dark: #05162e;
            --navy-mid: #0a2447;
            --gold: #e5c158;
            --white: #ffffff;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #e2e8f0;
            --ink: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        /* LEFT SIDE — 60% white */
        .side-white {
            flex: 0 0 60%;
            max-width: 60%;
            background: #ffffff;
            background-image: radial-gradient(circle at 80% 20%, rgba(229, 193, 88, 0.07) 0%, transparent 45%),
                               radial-gradient(circle at 20% 80%, rgba(5, 22, 46, 0.04) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 80px 90px;
            position: relative;
        }

        .side-white .brand-mark {
            font-family: 'Lexend', sans-serif;
            font-size: 1.4rem;
            color: var(--navy-dark);
            letter-spacing: 1px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .side-white .brand-mark::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold);
            display: inline-block;
        }

        .side-white h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 3.2rem;
            line-height: 1.15;
            color: var(--navy-dark);
            margin-bottom: 22px;
            max-width: 520px;
        }

        .side-white h1 span {
            color: var(--gold);
        }

        .side-white p.subtext {
            font-size: 1.05rem;
            color: #64748b;
            max-width: 460px;
            line-height: 1.6;
        }

        .stat-row {
            display: flex;
            gap: 50px;
            margin-top: 60px;
        }

        .stat-row .stat-item h3 {
            font-family: 'Lexend', sans-serif;
            font-size: 1.8rem;
            color: var(--navy-dark);
        }

        .stat-row .stat-item p {
            font-size: 0.8rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* RIGHT SIDE — 40% navy blue */
        .side-navy {
            flex: 0 0 40%;
            max-width: 40%;
            background: var(--navy-dark);
            background-image: radial-gradient(circle at 85% 15%, rgba(229, 193, 88, 0.08) 0%, transparent 45%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
        }

        .logo-area { text-align: center; margin-bottom: 40px; }
        .logo-area h1 {
            font-family: 'Lexend', sans-serif;
            font-size: 2.3rem;
            color: var(--gold);
            margin-bottom: 8px;
        }
        .logo-area p {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 400;
        }

        .input-group { margin-bottom: 22px; }
        .input-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(229, 193, 88, 0.15);
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }
        .input-group input::placeholder { color: rgba(255,255,255,0.35); }
        .input-group input:focus {
            border-color: var(--gold);
            outline: none;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.1);
        }

        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 46px;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            padding: 4px;
            transition: color 0.2s;
        }
        .toggle-password:hover { color: var(--gold); }
        .toggle-password svg { width: 20px; height: 20px; }
        .toggle-password .icon-eye-off { display: none; }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #ff8080;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-main {
            width: 100%;
            padding: 16px;
            background: var(--gold);
            color: var(--navy-dark);
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 193, 88, 0.3);
        }

        .footer-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .footer-link span {
            color: var(--gold);
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
        }
        .footer-link span:hover { text-decoration: underline; }

        /* Responsive: stack on small screens */
        @media (max-width: 900px) {
            body { flex-direction: column; overflow-y: auto; }
            .side-white, .side-navy {
                flex: 1 1 auto;
                max-width: 100%;
                width: 100%;
            }
            .side-white {
                padding: 50px 30px;
                text-align: center;
                align-items: center;
            }
            .side-white h1 { font-size: 2.2rem; }
            .stat-row { justify-content: center; }
            .side-navy { padding: 50px 30px; }
        }
    </style>
</head>
<body>

    <!-- LEFT: 60% white informational side -->
    <section class="side-white">
        <h1>Welcome back to <span>SmartStep.</span></h1>
        <p class="subtext">Where Harvesting motion, Powering Tomorrow.</p>
    </section>

    <!-- RIGHT: 40% navy login side -->
    <section class="side-navy">
        <div class="auth-card">
            <header class="logo-area">
                <h1>SmartStep</h1>
            </header>

            <div id="errorMsg" class="error-msg" style="display: none;">
                Invalid email or password.
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="name@email.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span class="toggle-password" id="togglePassword">
                            <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </span>
                    </div>
                </div>

                <p style="text-align:right; margin-top:-12px; margin-bottom:20px;">
                    <span onclick="window.location.href='forget.html'" style="color:var(--gold); font-size:0.85rem; cursor:pointer; font-weight:600;">Forgot password?</span>
                </p>

                <button type="submit" class="btn-main" id="signInBtn">Sign In</button>
            </form>

            <p class="footer-link">Do you want to <span onclick="window.location.href='register.html'">Create Account ? </span></p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://qvadzitiwgkhzlgjmdac.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2YWR6aXRpd2draHpsZ2ptZGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NjkyNjAsImV4cCI6MjA5MjM0NTI2MH0.8COO3BlKQNgXMwo_GZUTIt-Kxs0WfhHJ2yrL3e9--9c";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const signInBtn = document.getElementById('signInBtn');

        // ---- Show/Hide password toggle ----
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePassword.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePassword.querySelector('.icon-eye').style.display = isHidden ? 'none' : 'block';
            togglePassword.querySelector('.icon-eye-off').style.display = isHidden ? 'block' : 'none';
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // Reset UI
            errorMsg.style.display = 'none';
            signInBtn.innerText = "Authenticating...";
            signInBtn.disabled = true;

            try {
                // STEP 1: Authenticate with Supabase
                const { data: { user }, error: authError } = await _supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (authError) throw authError;

                // STEP 2: Get role from users table using auth UUID
                const { data: userData, error: dbError } = await _supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', user.id)
                    .single();

                if (dbError || !userData) {
                    console.warn("No role found, defaulting to user dashboard.");
                    window.location.href = "user-dash.html";
                } else {
                    // STEP 3: Redirect based on role
                    if (userData.role === "admin") {
                        window.location.href = "ad_dash.html";
                    } else {
                        window.location.href = "user-dash.html";
                    }
                }

            } catch (error) {
                console.error("Auth Error:", error.message);
                errorMsg.style.display = 'block';
                errorMsg.innerText = error.message;

                // Reset button
                signInBtn.innerText = "Sign In";
                signInBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
