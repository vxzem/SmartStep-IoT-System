<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStep | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lexend:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #0b1f3a;
            --gold: #e5c158;
            --white: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --new: #132c52;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
       
        body {
            font-family: 'Inter', sans-serif;
            background: var(--new);
            background-image: radial-gradient(circle at 15% 15%, rgba(229, 193, 88, 0.06) 0%, transparent 45%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--white);
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
            background: var(--navy-dark);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(229, 193, 88, 0.3);
            border-radius: 20px;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        .logo-area { text-align: center; margin-bottom: 40px; }
        .logo-area h1 { 
            font-family: 'Lexend', sans-serif; 
            font-size: 2.6rem; 
            color: var(--gold); 
            margin-bottom: 8px;
        }
        .logo-area p { 
            font-size: 0.82rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
        }

        .input-group { margin-bottom: 24px; }
        .input-group label {
            display: block; 
            font-size: 0.72rem; 
            font-weight: 700;
            color: var(--gold); 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .input-group input {
            width: 100%; 
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; 
            padding: 15px; 
            color: white; 
            font-size: 1rem;
            transition: 0.3s;
        }
        .input-group input:focus { 
            border-color: var(--gold); 
            outline: none; 
            background: rgba(255, 255, 255, 0.12); 
            box-shadow: 0 0 15px rgba(229, 193, 88, 0.1);
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            color: #ff8080;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-main {
            width: 100%; 
            padding: 16px; 
            background: var(--gold);
            color: var(--navy-dark); 
            border: none; 
            border-radius: 10px;
            font-weight: 800; 
            font-size: 1.05rem; 
            cursor: pointer;
            text-transform: uppercase; 
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(229, 193, 88, 0.3);
        }

        .footer-link { 
            text-align: center; 
            margin-top: 30px; 
            font-size: 0.9rem; 
            color: var(--text-muted); 
        }
        .footer-link span { 
            color: var(--gold); 
            cursor: pointer; 
            font-weight: 700; 
            text-decoration: none; 
        }
        .footer-link span:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <header class="logo-area">
            <h1>SmartStep</h1>
            <p>Access Portal</p>
        </header>

        <div id="errorMsg" class="error-msg" style="display: none;">
            Invalid email or password.
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@email.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-main" id="signInBtn">Sign In</button>
        </form>
        
        <p class="footer-link">New operator? <span onclick="window.location.href='register.html'">Create Account</span></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://qvadzitiwgkhzlgjmdac.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2YWR6aXRpd2draHpsZ2ptZGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NjkyNjAsImV4cCI6MjA5MjM0NTI2MH0.8COO3BlKQNgXMwo_GZUTIt-Kxs0WfhHJ2yrL3e9--9c";
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginForm = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');
const signInBtn = document.getElementById('signInBtn');

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    // Reset UI
    errorMsg.style.display = 'none';
    signInBtn.innerText = "Authenticating...";
    signInBtn.disabled = true;

    try {
        // STEP 1: Authenticate with Supabase
        const { data: { user }, error: authError } = await _supabase.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (authError) throw authError;

        // STEP 2: Get role from users table using auth UUID
        const { data: userData, error: dbError } = await _supabase
            .from('profiles')          // ✅ changed from 'profiles'
            .select('role')
            .eq('id', user.id)      // ✅ auth UUID from login
            .single();

        if (dbError || !userData) {
            console.warn("No role found, defaulting to user dashboard.");
            window.location.href = "user-dash.html";
        } else {
            // STEP 3: Redirect based on role
            if (userData.role === "ADMIN") {
                window.location.href = "dash.html";
            } else {
                window.location.href = "user-dash.html";
            }
        }

    } catch (error) {
        console.error("Auth Error:", error.message);
        errorMsg.style.display = 'block';
        errorMsg.innerText = error.message;

        // Reset button
        signInBtn.innerText = "Sign In";
        signInBtn.disabled = false;
    }
});
    </script>
</body>
</html>
